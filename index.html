<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Química 3D na mão v3</title>
<script>document.title="Química 3D na mão v3"</script>
<style>
:root{--bg:#0a0f1f;--glass:rgba(10,15,31,.72);--tx:#f2f5ff;--mu:#a9b4d6;--ac:#38bdf8;--bd:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1f}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.top,.bot{position:fixed;left:0;right:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top{top:env(safe-area-inset-top,0px)}.bot{bottom:env(safe-area-inset-bottom,0px)}
.top>*,.bot>*{pointer-events:auto}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#sml{font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center;background:var(--glass);border-radius:999px;padding:6px 10px}#sml input{width:70px}
.tab,.cam,.chip{border:1px solid var(--bd);background:var(--glass);color:var(--tx);border-radius:999px;padding:10px 14px;font-family:inherit;font-weight:600;font-size:14px;backdrop-filter:blur(8px)}
.tab{flex:1;padding:9px 6px;font-size:13px}.tab.on,.chip.on{background:var(--ac);color:#04121f;border-color:var(--ac)}
.cam{white-space:nowrap}.cam.on{border-color:#4ade80;color:#4ade80}
#st{font-size:12px;color:var(--mu);background:var(--glass);border-radius:10px;padding:6px 10px;align-self:flex-start}
#info{background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px)}
#info h2{margin:0;font-size:17px}#info small{color:var(--ac);font-weight:600}
#info p{margin:6px 0 0;font-size:13.5px;line-height:1.4;color:var(--mu)}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;font-size:13px}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div class="top">
  <div class="row"><button class="tab on" id="t0">1 · Modelos atômicos</button><button class="tab" id="t1">2 · Geometria molecular</button></div>
  <div class="row"><button class="cam" id="cam">🖐️ Ativar câmera</button><button class="cam" id="flip">🔄 Virar</button><label id="sml">Suavidade<input type="range" id="sm" min="0" max="100" value="50"></label></div><span id="st">Arraste para girar</span>
</div>
<div class="bot"><div id="info"></div><div id="chips"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,50);cam.position.z=5;
scene.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,4,5);scene.add(dl);
const holder=new THREE.Group(),content=new THREE.Group();holder.add(content);scene.add(holder);
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const Y=new THREE.Vector3(0,1,0),Z=new THREE.Vector3(0,0,1);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.35,metalness:.1},o));
const sph=(r,c,o)=>new THREE.Mesh(new THREE.SphereGeometry(r,32,24),mat(c,o));
let anims=[];
function orbit(r,n,sp,tilt,col,ring=true,er=.05){
  const g=new THREE.Group();g.rotation.x=tilt;
  if(ring)g.add(new THREE.Mesh(new THREE.TorusGeometry(r,.006,8,96),new THREE.MeshBasicMaterial({color:0x8899cc,transparent:true,opacity:.6})).rotateX(Math.PI/2));
  const es=[];for(let i=0;i<n;i++){const e=sph(er,col,{emissive:col,emissiveIntensity:.5});g.add(e);es.push(e)}
  anims.push(t=>es.forEach((e,i)=>{const a=t*sp+i*6.283/n;e.position.set(Math.cos(a)*r,0,Math.sin(a)*r)}));
  content.add(g);
}
const fib=(i,n)=>{const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),a=i*2.39996;return new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r)};
function tag(txt,col,s){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle=col;x.font='bold 60px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,32,36);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));sp.scale.set(s,s,1);return sp}
function ell(a,b,rx,ry,rz,n,sp,ph){const g=new THREE.Group();g.rotation.set(rx,ry,rz);const pts=[];for(let i=0;i<=128;i++){const t=i/128*6.2832;pts.push(new THREE.Vector3(Math.cos(t)*a,Math.sin(t)*b,0))}
 g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x9fb2e0})));
 const es=[];for(let i=0;i<n;i++){const e=sph(.055,0x60a5fa,{emissive:0x3b82f6,emissiveIntensity:.7});g.add(e);es.push(e)}
 anims.push(t=>es.forEach((e,i)=>{const th=t*sp+ph+i*6.2832/n;e.position.set(Math.cos(th)*a,Math.sin(th)*b,0)}));content.add(g)}
const ATOMS=[
{n:'Dalton',s:'1803 · Bola de bilhar',t:'O átomo é uma esfera maciça, indivisível e indestrutível, como uma bola de bilhar. Átomos de um mesmo elemento são idênticos.',
 b(){content.add(sph(.95,0xd62828,{roughness:.15}))}},
{n:'Thomson',s:'1903 · Pudim de passas',t:'O átomo passa a ser divisível: esfera positiva (+) com elétrons negativos (−) incrustados, inclusive na superfície.',
 b(){content.add(sph(1,0x1f8fa6,{transparent:true,opacity:.6,roughness:.3}));
  [.98,.55,.98,.65,.98,.5,.98].forEach((r,i)=>{const d=fib(i*3+1,22),p=d.clone().multiplyScalar(r);const e=sph(.13,0xf4978e);e.position.copy(p);content.add(e);const m=tag('−','#7a1c14',.3);m.position.copy(p).add(d.clone().multiplyScalar(.14));content.add(m)});
  for(let i=0;i<10;i++){const m=tag('+','#d7f3ff',.24);m.position.copy(fib(i*2+3,24)).multiplyScalar(.35+(i%3)*.2);content.add(m)}}},
{n:'Rutherford',s:'1911 · Modelo planetário',t:'Descobre-se o núcleo: pequeno, denso e positivo. Os elétrons orbitam ao redor dele e o átomo é quase todo espaço vazio.',
 b(){content.add(sph(.14,0xffd54a,{emissive:0xffb300,emissiveIntensity:.6}));const p=tag('+','#5a3b00',.26);content.add(p);
  ell(1.1,.42,0,0,0,2,1.6,0);ell(1.1,.42,.35,0,1.05,2,1.3,1);ell(1.1,.42,-.35,0,2.1,2,1.1,2);ell(1.1,.42,0,.7,1.57,2,1.45,3)}},
{n:'Bohr',s:'1913 · Sistema planetário',t:'Os elétrons ocupam camadas eletrônicas (níveis de energia) bem definidas ao redor do núcleo. Exemplo: Na (2-8-1).',
 b(){for(let i=0;i<10;i++){const q=sph(.075,i%2?0xe5484d:0x9aa0aa);q.position.copy(fib(i,10)).multiplyScalar(.1);content.add(q)}
  const T=Math.PI/2;orbit(.45,2,2.4,T,0x60a5fa);orbit(.75,8,1.3,T,0x60a5fa,true,.04);orbit(1.1,1,.8,T,0xfacc15,true,.05)}},
{n:'Quântico',s:'Schrödinger · Orbitais',t:'Não há trajetórias: há orbitais, regiões de maior probabilidade de encontrar o elétron. Aqui: orbital 1s (esfera) e 2p (halteres).',
 b(){content.add(sph(.1,0xff6b6b,{emissive:0xff2222,emissiveIntensity:.5}));
  const N=1800,p=new Float32Array(N*3),g=()=>(Math.random()+Math.random()+Math.random()-1.5);
  for(let i=0;i<N;i++){let x,y,z;if(i<700){const d=new THREE.Vector3().randomDirection().multiplyScalar(Math.min(-Math.log(Math.random()+.001)*.2,.8));x=d.x;y=d.y;z=d.z}else{x=g()*.22;y=g()*.22;z=(i%2?1:-1)*(.5+g()*.3)}
   p.set([x,y,z],i*3)}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(p,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0x38bdf8,size:.04,transparent:true,opacity:.75,depthWrite:false,blending:THREE.AdditiveBlending}));
  content.add(pts);anims.push(t=>{pts.rotation.y=t*.3})}}
];

const E={H:[0xffffff,.2],C:[0x444444,.3],O:[0xe53935,.28],N:[0x1e6bff,.28],F:[0x43c04a,.24],B:[0xe86aa8,.28],Cl:[0x2ea64f,.3],P:[0xf5a31a,.32],S:[0xf2d21f,.34]};
const tri=(r,y=0,off=90)=>[0,1,2].map(i=>{const a=(off+i*120)*Math.PI/180;return[Math.cos(a)*r,y,Math.sin(a)*r]});
const s3=.577;
const MOLS=[
{n:'Linear',s:'CO₂ · 180°',t:'3 átomos na mesma linha, sem pares livres no central. Molécula apolar (simétrica).',
 a:[['C',0,0,0],['O',1.1,0,0],['O',-1.1,0,0]],b:[[0,1,2],[0,2,2]]},
{n:'Angular',s:'H₂O · ~104,5°',t:'2 ligantes e 2 pares livres no oxigênio. Os pares livres comprimem o ângulo. Molécula polar.',
 a:[['O',0,0,0],['H',.79,-.61,0],['H',-.79,-.61,0]],b:[[0,1,1],[0,2,1]],lp:[[0,.55,.8],[0,.55,-.8]]},
{n:'Trigonal plana',s:'BF₃ · 120°',t:'4 átomos no mesmo plano, sem pares livres. Molécula apolar (simétrica).',
 a:[['B',0,0,0],...tri(1).map(p=>['F',...p])],b:[[0,1,1],[0,2,1],[0,3,1]]},
{n:'Piramidal trigonal',s:'NH₃ · ~107°',t:'4 átomos em forma de pirâmide, 1 par livre no nitrogênio. Molécula polar.',
 a:[['N',0,0,0],...tri(.94,-.33).map(p=>['H',...p])],b:[[0,1,1],[0,2,1],[0,3,1]],lp:[[0,1,0]]},
{n:'Tetraédrica',s:'CH₄ · 109,5°',t:'5 átomos formando um tetraedro, sem pares livres. Molécula apolar (simétrica).',
 a:[['C',0,0,0],['H',s3*1.7,s3*1.7,s3*1.7],['H',s3*1.7,-s3*1.7,-s3*1.7],['H',-s3*1.7,s3*1.7,-s3*1.7],['H',-s3*1.7,-s3*1.7,s3*1.7]],b:[[0,1,1],[0,2,1],[0,3,1],[0,4,1]]},
{n:'Bipiramidal trigonal',s:'PCl₅ · 90° e 120°',t:'6 átomos: 2 axiais e 3 equatoriais. Ângulos de 90° (axial–equatorial) e 120° (equatorial–equatorial). Octeto expandido. Apolar.',
 a:[['P',0,0,0],['Cl',0,1.15,0],['Cl',0,-1.15,0],...tri(1.1).map(p=>['Cl',...p])],b:[[0,1,1],[0,2,1],[0,3,1],[0,4,1],[0,5,1]]},
{n:'Octaédrica',s:'SF₆ · 90°',t:'7 átomos em forma de octaedro, 6 ligações S–F e nenhum par livre. Octeto expandido. Molécula apolar.',
 a:[['S',0,0,0],['F',1.1,0,0],['F',-1.1,0,0],['F',0,1.1,0],['F',0,-1.1,0],['F',0,0,1.1],['F',0,0,-1.1]],b:[1,2,3,4,5,6].map(i=>[0,i,1])}
];
MOLS.forEach(d=>{const bonds=d.b;d.build=function(){
  const V=a=>new THREE.Vector3(a[1],a[2],a[3]);
  d.a.forEach(a=>{const[c,r]=E[a[0]];const m=sph(r,c);m.position.copy(V(a));content.add(m)});
  bonds.forEach(([i,j,o])=>{const A=V(d.a[i]),B=V(d.a[j]),dir=B.clone().sub(A),len=dir.length();dir.normalize();
    const q=new THREE.Quaternion().setFromUnitVectors(Y,dir);
    let pp=new THREE.Vector3().crossVectors(dir,Z);if(pp.length()<.1)pp.crossVectors(dir,Y);pp.normalize();
    (o==2?[-.07,.07]:[0]).forEach(f=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,len,12),mat(0xb8c0d0));c.position.copy(A.clone().add(B).multiplyScalar(.5).add(pp.clone().multiplyScalar(f)));c.quaternion.copy(q);content.add(c)})});
  (d.lp||[]).forEach(p=>{const dir=new THREE.Vector3(...p).normalize();const e=sph(1,0xfff3a0,{transparent:true,opacity:.45,emissive:0xffe066,emissiveIntensity:.3});e.scale.set(.16,.3,.16);e.position.copy(dir).multiplyScalar(.55);e.quaternion.setFromUnitVectors(Y,dir);content.add(e)});
}});
ATOMS.forEach(d=>d.build=d.b);

let mode=0,cur=0,facing='user',stream=null;
function show(i){cur=i;const d=(mode?MOLS:ATOMS)[i];
  while(content.children.length)content.remove(content.children[0]);anims=[];d.build();
  $('info').innerHTML=`<h2>${d.n}</h2><small>${d.s}</small><p>${d.t}</p>`;
  [...$('chips').children].forEach((c,k)=>c.classList.toggle('on',k==i));}
function setMode(m){mode=m;$('t0').classList.toggle('on',!m);$('t1').classList.toggle('on',!!m);
  $('chips').innerHTML=(m?MOLS:ATOMS).map((d,i)=>`<button class="chip" data-i="${i}">${d.n}</button>`).join('');show(0)}
$('t0').onclick=()=>setMode(0);$('t1').onclick=()=>setMode(1);
$('chips').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined)show(+i)};

// toque: girar / zoom
let drag=false,lx=0,ly=0,offX=0,offY=0,zoom=1;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointermove',e=>{if(!drag)return;offY+=(e.clientX-lx)*.01;offX+=(e.clientY-ly)*.01;lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{zoom=Math.min(2.5,Math.max(.5,zoom-e.deltaY*.001))},{passive:true});

// mão
let hand=false,lastSeen=0,camOn=false,hands=null,hSign=0,fs={},sm=50,ts=1.1;
const tp=new THREE.Vector3(0,.9,0),tq=new THREE.Quaternion();
$('sm').oninput=e=>sm=+e.target.value;
// filtro One Euro: tira o tremor sem atrasar movimentos rápidos
const oe=(k,x,t,mc,b)=>{let s=fs[k];if(!s){fs[k]={x,dx:0,t};return x}const dt=Math.max(t-s.t,.001),al=c=>1/(1+1/(2*Math.PI*c*dt));s.dx+=al(1)*((x-s.x)/dt-s.dx);s.x+=al(mc+b*Math.abs(s.dx))*(x-s.x);s.t=t;return s.x};
function onHands(r){
  const L=r.multiHandLandmarks&&r.multiHandLandmarks[0];if(!L)return;
  const W=r.multiHandWorldLandmarks&&r.multiHandWorldLandmarks[0],t=performance.now()/1000,mc=3.2-sm*.028;
  if(!hand){fs={};hSign=0;$('st').textContent='Mão detectada ✔'}
  hand=true;lastSeen=performance.now();
  const v=$('v'),vw=v.videoWidth,vh=v.videoHeight,sc=Math.max(innerWidth/vw,innerHeight/vh),ox=(innerWidth-vw*sc)/2,oy=(innerHeight-vh*sc)/2,mir=facing==='user';
  // posição e tamanho: mapeados pixel a pixel (corrige o corte do vídeo na tela)
  const P=i=>{const x=oe('x'+i,L[i].x,t,mc,15),y=oe('y'+i,L[i].y,t,mc,15);let sx=x*vw*sc+ox;if(mir)sx=innerWidth-sx;return[sx,y*vh*sc+oy]};
  const p=[0,5,9,13,17].map(P),cx=p.reduce((s,a)=>s+a[0],0)/5,cy=p.reduce((s,a)=>s+a[1],0)/5,len=Math.hypot(p[2][0]-p[0][0],p[2][1]-p[0][1]);
  const hH=Math.tan(25*Math.PI/180)*5,hW=hH*cam.aspect,k=2*hH/innerHeight;
  tp.set((cx/innerWidth-.5)*2*hW,(.5-cy/innerHeight)*2*hH+len*k*.5,0);
  ts=Math.max(.25,len*k*1.45)*zoom;
  // orientação 3D completa da palma (usa coordenadas métricas da mão)
  const kx=W?1:vw/1500,ky=W?1:vh/1500,Q=W||L;
  const f=i=>{const q=Q[i];return new THREE.Vector3(oe('X'+i,(mir?-1:1)*q.x*kx,t,mc*.6,6),oe('Y'+i,-q.y*ky,t,mc*.6,6),oe('Z'+i,-q.z*kx,t,mc*.6,6))};
  const A=f(0),B=f(5),C=f(9),D=f(17);
  const up=C.sub(A).normalize(),nz=new THREE.Vector3().crossVectors(D.sub(B).normalize(),up);
  if(!hSign)hSign=nz.z>=0?1:-1;
  nz.multiplyScalar(hSign).normalize();
  const yy=up.sub(nz.clone().multiplyScalar(up.dot(nz))).normalize(),xx=new THREE.Vector3().crossVectors(yy,nz);
  tq.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xx,yy,nz));
}
async function openStream(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});
  const v=$('v');v.srcObject=stream;await v.play();v.style.transform=facing==='user'?'scaleX(-1)':'none';
}
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';if(!camOn){startCam();return}try{await openStream()}catch(e){$('st').textContent='Não consegui virar a câmera.'}};
async function startCam(){
  const st=$('st');
  try{
    await openStream();$('v').style.display='block';camOn=true;$('cam').classList.add('on');$('cam').textContent='🖐️ Câmera ligada';
  }catch(e){st.textContent='Não consegui acessar a câmera. Permita o acesso e tente de novo.';return}
  st.textContent='Carregando rastreamento da mão…';
  try{
    hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.7,minTrackingConfidence:.6});
    hands.onResults(onHands);await hands.initialize();
    st.textContent='Mostre a palma da mão aberta para a câmera';
    const v=$('v');let busy=false;
    (async function loop(){if(!busy&&v.readyState>=2){busy=true;try{await hands.send({image:v})}catch(e){}busy=false}requestAnimationFrame(loop)})();
  }catch(e){hands=null;st.textContent='Rastreamento da mão indisponível aqui. Use o toque para girar.'}
}
$('cam').onclick=()=>{if(!camOn)startCam()};

let last=performance.now();const ID=new THREE.Quaternion(),HOME=new THREE.Vector3(0,.9,0);
(function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000||.016,.1);last=now;anims.forEach(f=>f(now/1000));
  if(hand&&now-lastSeen>600){hand=false;if(hands)$('st').textContent='Mão perdida. Mostre a palma de novo'}
  if(hand){const ka=1-Math.exp(-dt*28),kr=1-Math.exp(-dt*22);holder.position.lerp(tp,ka);holder.scale.setScalar(holder.scale.x+(ts-holder.scale.x)*ka);holder.quaternion.slerp(tq,kr)}
  else{const k=1-Math.exp(-dt*5);holder.position.lerp(HOME,k);holder.scale.setScalar(holder.scale.x+(1.15*zoom-holder.scale.x)*k);holder.quaternion.slerp(ID,k);if(!drag)offY+=dt*.4}
  content.rotation.set(offX,offY,0);
  renderer.render(scene,cam);
})(performance.now());
setMode(0);
</script>
</body>
</html>
